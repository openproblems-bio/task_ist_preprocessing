# Parameter sweep for the watershed segmentation method - FOLLOW-UP (narrowed) sweep.
#
# AUTO-GENERATED - do not hand-edit; regenerate by rendering
#   results/param_sweeps/Yaml_to_heatmap_cellposev4.qmd
# from the sweep results in ~/projects/txsim_results/param_sweep_tests/segmentation/watershed
#
# Selection: the 3 parameter families that reach the Pareto front (max cells,
# max negative marker purity) in the most datasets, tie-broken by how many datasets
# they beat `default` in and then by Euclidean distance from `default`. Within each
# family: every value on the front in >=1 dataset, plus the highest-distance value,
# topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total watershed variants = 1 default + 9 swept values.
parameters:
  watershed:
    default:
      threshold_func: "local_otsu"
      blur_sigma: 1
      local_maxima_min_distance: 5
      post_processing_min_size_1: 64
    sweep:
      # on front in 1/3 datasets, beats default in 0; picked: 2 (on front), 4 (max distance), 3 (distance top-up)
      blur_sigma: [2, 3, 4]
      # on front in 1/3 datasets, beats default in 0; picked: 128 (on front), 512 (max distance), 256 (distance top-up)
      post_processing_min_size_1: [128, 256, 512]
      # on front in 0/3 datasets, beats default in 0; picked: 20 (max distance), 15 (distance top-up), 10 (distance top-up)
      local_maxima_min_distance: [10, 15, 20]
