# from the sweep results in /Users/daria.romanovskaia/projects/txsim_results/param_sweep_tests/transcript_assignment/proseg
#
# Selection: the 3 parameter families that reach the Pareto front (max cells,
# max negative marker purity) in the most datasets, tie-broken by how many datasets
# they beat `default` in and then by Euclidean distance from `default`. Within each
# family: every value on the front in >=1 dataset, plus the highest-distance value,
# topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total proseg variants = 1 default + 7 swept values.
parameters:
  proseg:
    default:
      cell_compactness: 0.04
      nuclear_reassignment_prob: 0.2
      diffusion_probability: 0.2
      ncomponents: 10
    sweep:
      # on front in 1/3 datasets, beats default in 3; picked: 0.03 (front + max distance), 0.06 (distance top-up), 0.02 (distance top-up)
      cell_compactness: [0.02, 0.03, 0.06]
      # on front in 1/3 datasets, beats default in 2; picked: 0.5 (front + max distance), 0.05 (distance top-up)
      nuclear_reassignment_prob: [0.05, 0.5]
      # on front in 1/3 datasets, beats default in 1; picked: 15 (on front), 5 (max distance)
      ncomponents: [5, 15]
