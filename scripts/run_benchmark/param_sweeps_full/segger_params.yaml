# Parameter sweep for the segger transcript assignment method - FOLLOW-UP (narrowed) sweep.
#
# AUTO-GENERATED - do not hand-edit; regenerate by rendering
#   results/param_sweeps/Yaml_to_heatmap_transcript_assignment.qmd
# from the sweep results in /Users/daria.romanovskaia/projects/txsim_results/param_sweep_tests/transcript_assignment/segger
#
# Selection: the 3 parameter families that reach the Pareto front (max cells,
# max negative marker purity) in the most datasets, tie-broken by how many datasets
# they beat `default` in and then by Euclidean distance from `default`. Within each
# family: every value on the front in >=1 dataset, plus the highest-distance value,
# topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total segger variants = 1 default + 6 swept values.
parameters:
  segger:
    default:
      n_epochs: 20
      prediction_graph_buffer_ratio: 0.05
      prediction_mode: "cell"
      node_representation_dim: 128
    sweep:
      # on front in 1/3 datasets, beats default in 2; picked: 0.1 (on front), 0.25 (max distance), 0.5 (distance top-up)
      prediction_graph_buffer_ratio: [0.1, 0.25, 0.5]
      # on front in 0/3 datasets, beats default in 2; picked: 60 (max distance), 40 (distance top-up)
      n_epochs: [40, 60]
      # on front in 0/3 datasets, beats default in 1; picked: nucleus (max distance)
      prediction_mode: ["nucleus"]
