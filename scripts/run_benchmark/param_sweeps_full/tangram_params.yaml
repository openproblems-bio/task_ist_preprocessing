# Parameter sweep for the tangram cell type annotation method - FOLLOW-UP (narrowed) sweep.
#
# AUTO-GENERATED - do not hand-edit; regenerate by rendering
#   results/param_sweeps/Yaml_to_heatmap_cell_type_annotation.qmd
# from the sweep results in /Users/daria.romanovskaia/projects/txsim_results/param_sweep_tests/cell_type_annotation/tangram
#
# Selection: the 3 parameter families that reach the Pareto front (max per-cell-type
# co-expression similarity, max negative marker purity) in the most datasets, tie-broken by
# how many datasets they beat `default` in and then by Euclidean distance from `default`.
# Within each family: every value on the front in >=1 dataset, plus the highest-distance
# value, topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total tangram variants = 1 default + 4 swept values.
parameters:
  tangram:
    default:
      mode: "clusters"
      num_epochs: 1000
    sweep:
      # on front in 1/3 datasets, beats default in 1; picked: cells (front + max distance)
      mode: ["cells"]
      # on front in 0/3 datasets, beats default in 1; picked: 3000 (max distance), 2000 (distance top-up), 100 (distance top-up)
      num_epochs: [100, 2000, 3000]
