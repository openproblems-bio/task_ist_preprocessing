# Parameter sweep for the comseg transcript assignment method - FOLLOW-UP (narrowed) sweep.
#
# AUTO-GENERATED - do not hand-edit; regenerate by rendering
#   results/param_sweeps/Yaml_to_heatmap_transcript_assignment.qmd
# from the sweep results in /Users/daria.romanovskaia/projects/txsim_results/param_sweep_tests/transcript_assignment/comseg
#
# Selection: the 3 parameter families that reach the Pareto front (max cells,
# max negative marker purity) in the most datasets, tie-broken by how many datasets
# they beat `default` in and then by Euclidean distance from `default`. Within each
# family: every value on the front in >=1 dataset, plus the highest-distance value,
# topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total comseg variants = 1 default + 7 swept values.
parameters:
  comseg:
    default:
      mean_cell_diameter: 15.0
      max_cell_radius: 25.0
      alpha: 0.5
      min_rna_per_cell: 5
      norm_vector: false
      allow_disconnected_polygon: true
    sweep:
      # on front in 1/3 datasets, beats default in 1; picked: 10.0 (front + max distance), 20.0 (on front)
      mean_cell_diameter: [10.0, 20.0]
      # on front in 1/3 datasets, beats default in 0; picked: 1.0 (front + max distance), 0.75 (on front), 0.25 (on front)
      alpha: [0.25, 0.75, 1.0]
      # on front in 0/3 datasets, beats default in 0; picked: 20 (max distance), 10 (distance top-up)
      min_rna_per_cell: [10, 20]
