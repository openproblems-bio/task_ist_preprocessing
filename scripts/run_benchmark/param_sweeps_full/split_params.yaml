# Parameter sweep for the split expression correction method - FOLLOW-UP (narrowed) sweep.
#
# AUTO-GENERATED - do not hand-edit; regenerate by rendering
#   results/param_sweeps/Yaml_to_heatmap_expression_correction.qmd
# from the sweep results in /Users/daria.romanovskaia/projects/txsim_results/param_sweep_tests/expression_correction/split
#
# Selection: the 3 parameter families that reach the Pareto front (max per-cell-type
# co-expression similarity, max negative marker purity) in the most datasets, tie-broken by
# how many datasets they beat `default` in and then by Euclidean distance from `default`.
# Within each family: every value on the front in >=1 dataset, plus the highest-distance
# value, topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total split variants = 1 default + 6 swept values.
parameters:
  split:
    default:
      gene_cutoff: 0.0
      fc_cutoff: 0.1
      gene_cutoff_reg: 0.0
      fc_cutoff_reg: 0.1
      umi_min: 20
      umi_min_sigma: 20
    sweep:
      # on front in 2/3 datasets, beats default in 3; picked: 100 (front + max distance), 50 (distance top-up)
      umi_min: [50, 100]
      # on front in 1/3 datasets, beats default in 2; picked: 1.0E-4 (on front), 2.0E-4 (max distance)
      gene_cutoff_reg: [1.0E-4, 2.0E-4]
      # on front in 0/3 datasets, beats default in 3; picked: 0.75 (max distance), 0.4 (distance top-up)
      fc_cutoff_reg: [0.4, 0.75]
