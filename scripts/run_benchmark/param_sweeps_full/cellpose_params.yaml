# Parameter sweep for the cellpose segmentation method - FOLLOW-UP (narrowed) sweep.
#
# AUTO-GENERATED - do not hand-edit; regenerate by rendering
#   results/param_sweeps/Yaml_to_heatmap_cellposev4.qmd
# from the sweep results in ~/projects/txsim_results/param_sweep_tests/segmentation/cellpose
#
# Selection: the 3 parameter families that reach the Pareto front (max cells,
# max negative marker purity) in the most datasets, tie-broken by how many datasets
# they beat `default` in and then by Euclidean distance from `default`. Within each
# family: every value on the front in >=1 dataset, plus the highest-distance value,
# topped up by distance to 3 values where the family has that many.
#
# Consumed by the run_benchmark workflow via the `method_parameters_yaml` setting
# (src/workflows/run_benchmark/main.nf): one "default" variant from `default:`,
# plus one variant per value in each `sweep:` list, varying a SINGLE arg at a time.
# Total cellpose variants = 1 default + 9 swept values.
parameters:
  cellpose:
    default:
      model_type: "cyto"
      diameter: 30.0
      flow_threshold: 0.4
      cellprob_threshold: 0.0
      min_size: 15
      resample: true
      normalize: true
      niter: 0
    sweep:
      # on front in 2/3 datasets, beats default in 2; picked: cyto3 (on front), nuclei (front + max distance), cyto2 (distance top-up)
      model_type: ["cyto2", "cyto3", "nuclei"]
      # on front in 2/3 datasets, beats default in 2; picked: 0.8 (on front), 0.2 (max distance), 0.6 (distance top-up)
      flow_threshold: [0.2, 0.6, 0.8]
      # on front in 1/3 datasets, beats default in 0; picked: 2.0 (on front), -2.0 (max distance), -1.0 (distance top-up)
      cellprob_threshold: [-2.0, -1.0, 2.0]
