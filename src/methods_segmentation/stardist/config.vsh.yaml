name: stardist
label: "Stardist Segmentation"
summary: "Output of the segmantation methot stardist"
description: "Output of the segmantation methot stardist"
links:
  documentation: "https://github.com/stardist/stardist"
  repository: "https://github.com/stardist/stardist"
references:
  doi: "10.48550/arXiv.1806.03535"


__merge__: /src/api/comp_method_segmentation.yaml 

arguments:
  - name: --model
    type: string
    default: "2D_versatile_fluo"
    description: >-
      Pretrained StarDist2D model loaded via StarDist2D.from_pretrained.
      Fluorescence/nuclear models: "2D_versatile_fluo" (default, trained on a DSB2018
      subset) and "2D_paper_dsb2018". "2D_versatile_he" is a brightfield H&E RGB model
      and is NOT appropriate for the single-channel fluorescence morphology images here.
  # --- StarDist predict_instances knobs, forwarded through predict_instances_big ---
  # All optional: when unset the model's own optimized values are used (thresholds.json
  # for prob/nms, no rescaling for scale) — i.e. exactly the pre-tuning behaviour.
  - name: --prob_thresh
    type: double
    required: false
    description: >-
      Object probability threshold; candidate pixels below it are discarded. If unset,
      the model's optimized value is used (0.479071 for 2D_versatile_fluo). LOWER => more /
      dimmer nuclei detected (higher recall); HIGHER => fewer, more confident detections
      (higher precision). Valid range ~0..1.
  - name: --nms_thresh
    type: double
    required: false
    description: >-
      Non-maximum-suppression IoU threshold for overlapping polygon candidates. If unset,
      the model's optimized value is used (0.3 for 2D_versatile_fluo). LOWER => more
      aggressive suppression (touching nuclei more likely merged/dropped); HIGHER => keeps
      more overlapping detections. Valid range ~0..1.
  - name: --scale
    type: double
    required: false
    description: >-
      Isotropic factor the image is rescaled by before prediction and undone afterwards.
      If unset, no rescaling. Use it to match nucleus size to the model's training size:
      >1 upscales (small nuclei appear larger), <1 downscales. StarDist's analogue of
      Cellpose's diameter.
  - name: --max_object_diameter
    type: integer
    required: false
    description: >-
      Upper bound (in original image pixels) on the largest object StarDist may produce.
      It sets predict_instances_big's `min_overlap` (the guaranteed block-stitching
      overlap), which MUST exceed the biggest nucleus/blob — otherwise stitching fails
      with "violates the assumption of being smaller than 'min_overlap'". Defaults to
      192 px if unset, and the script auto-doubles it on demand, so this is a
      robustness/geometry knob, NOT a quality knob: it does not change which pixels get
      segmented. Raise it if you hit that error or your nuclei are unusually large.

resources:
  - type: python_script
    path: script.py

engines:
  # NOTE: On mac the tensorflow install leads to an error. Develop the method in a conda env instead (and test docker via gh-actions). 
  #       Installations can be done with pip (except tensorflow: use conda install -c conda-forge tensorflow)
  - type: docker
    image: openproblems/base_tensorflow_nvidia:1 # TODO: ideally get gpu image to work
    #image: openproblems/base_python:1
    __merge__: 
      - /src/base/setup_spatialdata_partial.yaml
    setup:
      - type: python
        pypi:
          # TensorFlow must be >=2.18 so it allows numpy>=2.0. anndata/spatialdata
          # reference np.bool (readded in numpy 2.0), so a numpy<2.0 pin makes
          # `import anndata` crash at runtime; TF 2.17 caps numpy<2.0, so we bump TF.
          - stardist
          - tensorflow==2.18.0
          # csbdeep/stardist use the Keras 2 API via tf_keras, which must match
          # the tensorflow version (the base image ships tf_keras 2.17).
          - tf_keras==2.18.0
          - "numpy>=2.0.0,<2.2.0"
          - scipy<1.15.0
  - type: native

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ hightime, midcpu, highmem, gpu ]
