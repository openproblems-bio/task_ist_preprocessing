name: binning
label: "Binning Segmentation"
summary: "Segment the spatial data into equidistant square bins"
description: "The binning method for segmentation serves as a baseline of a poor segmentation"
links:
  documentation: "https://github.com/openproblems-bio/task_ist_preprocessing"
  repository: "https://github.com/openproblems-bio/task_ist_preprocessing"
references:
  doi: "10.1101/2023.02.13.528102"
  
__merge__: /src/api/comp_method_segmentation.yaml 

arguments:
  - name: --bin_size
    type: integer
    default: 30
    description: |
      Edge length of each square pseudo-cell bin, in PIXELS of the input `image`
      element. On this benchmark's standardized raw_ist grid (images are rasterized
      at target_unit_to_pixels=1, i.e. ~1 um/pixel) 1 px is ~1 um, so 30 px is
      ~30 um bins. Used only when --bin_size_um is not set.
  - name: --bin_size_um
    type: double
    required: false
    description: |
      Edge length of each square bin in MICRONS. When set, it OVERRIDES --bin_size:
      the script reads the input image's coordinate transform (um per pixel) and
      converts to a pixel bin size, so the physical bin size is comparable across
      datasets even if they are gridded at different pixel sizes. Leave unset to use
      --bin_size (raw pixels).

resources:
  - type: python_script
    path: script.py

engines:
  - type: docker
    image: openproblems/base_python:1
    __merge__: 
      - /src/base/setup_txsim_partial.yaml
      - /src/base/setup_spatialdata_partial.yaml
  - type: native

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ midtime, midcpu, midmem ]
