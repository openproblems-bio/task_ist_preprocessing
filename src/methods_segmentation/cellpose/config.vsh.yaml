name: cellpose
label: "Cellpose Segmentation"
summary: "Output of the segmantation methot cellpose"
description: "Output of the segmantation methot cellpose"
links:
  documentation: "https://github.com/openproblems-bio/task_ist_preprocessing"
  repository: "https://github.com/openproblems-bio/task_ist_preprocessing"
references:
  doi: "10.1038/s41592-020-01018-x"


__merge__: /src/api/comp_method_segmentation.yaml 

arguments:
  - name: --batch_size
    type: integer
    default: 8
  - name: --model_type
    type: string
    default: "cyto"
  - name: --resample
    type: boolean
    default: True
  - name: --channel_axis
    type: string
    default: "None"
  - name: --z_axis
    type: string
    default: "None"
  - name: --normalize
    type: boolean
    default: True
  - name: --invert
    type: boolean
    default: False
  - name: --rescale
    type: string
    default: "None"
  - name: --diameter
    type: double
    default: 30.0 #default should be None with cellpose v4
  - name: --do_3D
    type: boolean
    default: False
  - name: --anisotropy
    type: string
    default: "None"
#  - name: --net_avg
#    type: boolean
#    default: False
  - name: --augment
    type: boolean
    default: False
  #- name: --tile
  #  type: boolean
  #  default: True
  - name: --tile_overlap
    type: double
    default: 0.1
  #- name: --interp #Seems to be removed in v4
  #  type: boolean
  #  default: True
  - name: --flow_threshold
    type: double
    default: 0.4
  - name: --cellprob_threshold
    type: double
    default: 0.0
  - name: --min_size
    type: integer
    default: 15
  - name: --niter
    type: integer
    default: 0
    description: |
      Number of flow-dynamics iterations. 0 (Cellpose treats 0 or None the same)
      lets Cellpose set it proportional to the diameter (~200 at resample=true).
      Lower it (e.g. 50) to speed up the CPU path; raise it for large/elongated
      cells that under-converge. Forwarded verbatim to model.eval.
  - name: --stitch_threshold
    type: double
    default: 0.0

resources:
  - type: python_script
    path: script.py

engines:
  - type: docker
    image: openproblems/base_pytorch_nvidia:1 # TODO: ideally get gpu image to work
    #image: openproblems/base_python:1
    setup:
      - type: python
        pypi: cellpose<4.0.0
      # Pre-download the pretrained weights + size models into the image
      # (~/.cellpose) so runtime tasks never hit the cellpose model server
      # (avoids the intermittent "HTTP Error 504: Gateway Time-out" seen when
      # several segmentation tasks fetch the weights concurrently). Instantiating
      # Cellpose(model_type=m) caches both the mask model and its size model.
      # All four builtins are cached because the --model_type sweep selects among
      # them (see scripts/run_benchmark/cellpose_params.yaml).
      - type: docker
        run:
          - "python -c \"from cellpose import models; [models.Cellpose(gpu=False, model_type=m) for m in ['cyto','nuclei','cyto2','cyto3']]\""
    __merge__: 
      - /src/base/setup_txsim_partial.yaml
      - /src/base/setup_spatialdata_partial.yaml
  - type: native

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ midtime, midcpu, highmem, gpuhighmem ]
