name: bruker_cosmx_nsclc
namespace: datasets/loaders

argument_groups:
  - name: Inputs
    arguments:
      - type: string
        name: --input_raw
        example: "s3://openproblems-data/resources/raw_data/bruker_cosmx/Lung9_Rep1+SMI+Flat+data.tar.gz"
        description: |
          URL/path to the flat-files + cell-labels archive (`<sample>+SMI+Flat+data.tar.gz`).
          Passed as a string (not a staged file) on purpose: the script streams it and extracts
          only the members sopa needs. Supports s3:// (via s3fs) or a local path.
      - type: string
        name: --input_morphology
        example: "s3://openproblems-data/resources/raw_data/bruker_cosmx/Lung9_Rep1+RawMorphologyImages.tar.gz"
        description: |
          URL/path to the raw morphology-images archive (`<sample>+RawMorphologyImages.tar.gz`).
          Streamed in place; only the 4th z-plane (Z004) of each FOV is extracted. Supports
          s3:// (via s3fs) or a local path.
      - type: string
        name: --segmentation_id
        default: ["cell"]
        description: The segmentation identifier
        multiple: true
  - name: Metadata
    arguments:
      - type: string
        name: --dataset_id
        description: "A unique identifier for the dataset"
        required: true
      - name: --dataset_name
        type: string
        description: Nicely formatted name.
        required: true
      - type: string
        name: --dataset_url
        description: Link to the original source of the dataset.
        required: false
      - name: --dataset_reference
        type: string
        description: Bibtex reference of the paper in which the dataset was published.
        required: false
      - name: --dataset_summary
        type: string
        description: Short description of the dataset.
        required: true
      - name: --dataset_description
        type: string
        description: Long description of the dataset.
        required: true
      - name: --dataset_organism
        type: string
        description: The organism of the sample in the dataset.
        required: false
  - name: Outputs
    arguments:
      - name: "--output"
        __merge__: /src/api/file_common_ist.yaml
        direction: output
        required: true

resources:
  - type: python_script
    path: script.py

engines:
  - type: docker
    image: openproblems/base_python:1
    __merge__: 
      - /src/base/setup_spatialdata_partial.yaml
    setup:
      - type: python
        pypi:
          - sopa
          - s3fs  # stream the raw tar.gz archives from s3:// and extract only what sopa needs (see --input_raw)
  - type: native

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highmem, midcpu, midtime]
