__merge__: /src/api/comp_method_transcript_assignment.yaml

name: fastreseg
label: "fastReseg transcript assignment"
summary: "Spatial segmentation correction using fastReseg method"
description: |
  fastReseg is an R package designed to enhance the precision of cell segmentation in spatial transcriptomics by 
  leveraging transcriptomic data to correct and refine initial image-based segmentation results.
links:
  documentation: "https://github.com/openproblems-bio/task_ist_preprocessing"
  repository: "https://github.com/openproblems-bio/task_ist_preprocessing"
references:
  doi: "10.1038/s41598-025-08733-5"


# Method-specific FastReseg tuning knobs. Each default == FastReseg's TRUE package
# default for fastReseg_full_pipeline() (verified against the upstream signature), i.e.
# the value that was previously hardcoded in script.R. These are Tier-1 error-detection /
# correction levers; see NOTES.md ("Optimization / tuning") for tiers and ranges.
#
# ARG-ORDERING CONTRACT: orchestrator.sh passes these to script.R as POSITIONAL args
# appended AFTER the 6 file-path args, in this exact order:
#   args[7]=molecular_distance_cutoff, args[8]=flagCell_lrtest_cutoff,
#   args[9]=svmClass_score_cutoff,     args[10]=cutoff_spatialMerge.
# Keep config <-> orchestrator.sh <-> script.R in lockstep or the run silently corrupts.
arguments:
  - name: --molecular_distance_cutoff
    type: double
    default: 2.7
    description: |
      Maximum molecule-to-molecule distance (microns) within a connected transcript group
      during neighborhood search. FastReseg default 2.7. Sharpest lever on how transcripts
      are grouped into candidate cells: smaller => tighter / more fragmented groups, larger
      => looser groups that may merge neighbouring cells.
  - name: --flagCell_lrtest_cutoff
    type: double
    default: 5
    description: |
      Cutoff on lrtest_nlog10P (-log10 p-value of the likelihood-ratio test) used to flag
      putative mis-segmented cells with strong spatial dependency in their transcript-score
      profile. FastReseg default 5. Lower => more cells flagged for re-segmentation (more
      aggressive correction); higher => more conservative.
  - name: --svmClass_score_cutoff
    type: double
    default: -2
    description: |
      Transcript-score cutoff separating high- vs low-score transcript classes in the SVM
      used during error detection/correction. FastReseg default -2.
  - name: --cutoff_spatialMerge
    type: double
    default: 0.5
    description: |
      Spatial-constraint cutoff (fraction in 0-1) for accepting a merge event between two
      source transcript groups. FastReseg default 0.5 (a 50% cutoff).


resources:
  - type: bash_script
    path: orchestrator.sh
  - type: python_script
    path: input.py
  - type: r_script
    path: script.R
  - type: python_script
    path: output.py

engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: apt
        packages:
          - libv8-dev
          - libudunits2-dev
          - libabsl-dev
          - gdal-bin
          - libgdal-dev
          - r-base
          # FastReseg's R dependencies as prebuilt Debian binaries. Installing
          # these via apt avoids compiling terra/igraph/sf/spatstat/stringi/etc.
          # from source (extremely slow, especially under amd64 emulation on
          # arm64 hosts). Only concaveman + GiottoUtils/GiottoClass + FastReseg
          # itself still build from source below; their heavy deps are already
          # present as binaries here.
          - r-cran-remotes
          - r-cran-terra
          - r-cran-igraph
          - r-cran-sf
          - r-cran-matrix
          - r-cran-mass
          - r-cran-e1071
          - r-cran-dbscan
          - r-cran-data.table
          - r-cran-dplyr
          - r-cran-ggplot2
          - r-cran-reshape2
          - r-cran-stringr
          - r-cran-fs
          - r-cran-lmtest
          - r-cran-matrixstats
          - r-cran-geometry
          - r-cran-spatstat.geom
      - type: docker
        # Install FastReseg from GitHub. upgrade = "never" so remotes reuses the
        # apt-installed binary deps above instead of re-fetching/recompiling them
        # from CRAN; only the unpackaged deps (concaveman, GiottoUtils,
        # GiottoClass) and FastReseg itself are compiled from source.
        run:
          - Rscript -e 'options(warn = 2); remotes::install_github("Nanostring-Biostats/FastReseg", upgrade = "never", repos = "https://cran.rstudio.com")'
      - type: python
        # tacco provides the cell-type annotation used in input.py (tacco.tl.annotate).
        # Mirrors methods_cell_type_annotation/tacco. This replaced the previous ssam
        # path, which needed planktonspace + a matplotlib<3.9 pin.
        pypi: [anndata, numpy, tacco]
    __merge__:
      - /src/base/setup_txsim_partial.yaml
      - /src/base/setup_spatialdata_partial.yaml
  - type: native

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [ veryhightime, midcpu, highmem ]


##macOS workaround: export DOCKER_DEFAULT_PLATFORM=linux/amd64